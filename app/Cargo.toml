[package]
name = "leave-app"
version.workspace = true
edition.workspace = true

[dependencies]
leave-core = { path = "../core" }
chrono.workspace = true
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Storage", "Performance", "Blob", "BlobPropertyBag", "Url", "HtmlAnchorElement", "HtmlInputElement", "File", "FileList", "Element", "DomRect", "KeyboardEvent", "PointerEvent", "Navigator", "ServiceWorkerContainer", "MediaQueryList", "HtmlElement", "DomTokenList", "console", "StorageManager", "SubmitEvent", "Event", "EventTarget"] }
