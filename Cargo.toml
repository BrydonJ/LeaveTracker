[workspace]
resolver = "2"
members = ["core", "app"]

[workspace.package]
edition = "2021"
version = "1.0.0"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
